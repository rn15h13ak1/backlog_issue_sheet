# ============================================================
# backlog-issue-sheet 設定ファイル
# ============================================================
# このファイルをコピーして config.yaml を作ってください。
# config.yaml は .gitignore で除外されています（API キーを含むため）。
#
#   cp config.example.yaml config.yaml
#
# API キーは、環境変数 BACKLOG_API_KEY や、この設定ファイルと同じ場所の
# .env（BACKLOG_API_KEY=...）にも置けます。環境変数があれば、そちらを先に使います。
# ============================================================

backlog:
  space_host: "yourcompany.backlog.com"   # スペースのホスト名
  project_key: "MYPROJ"                   # 対象のプロジェクト（1 回の実行で 1 つだけ）
  api_key: "YOUR_API_KEY_HERE"            # Backlog API キー（個人設定 → API から取得）
  ssl_verify: true                        # オンプレ版で自己署名証明書のときだけ false
  base_path: ""                           # オンプレ版のパスプレフィックス（例: "/backlog"）

# ひな形・書き出し・実行ログ・結果の出力先（省略時: output）
# 相対パスは、この設定ファイルのある場所からの相対です。
output_dir: "output"
